<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шахматы Онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="debugInfo" class="debug-bar"></div>

<div class="container">

  <div id="mainMenu" class="screen active">
    <div class="card">
      <div class="title-row">
        <span class="crown">♚</span>
        <h1>Шахматы<br>Онлайн</h1>
        <span class="crown">♔</span>
      </div>
      <p class="subtitle">Играй с другом в любой точке мира</p>
      <button id="createGameBtn" class="btn-main">🎮 Создать игру</button>
      <p class="hint">Чтобы присоединиться к другу — просто перейдите по ссылке, которую он отправит</p>
    </div>
  </div>

  <div id="waitingScreen" class="screen">
    <div class="card">
      <h2>Ожидание соперника...</h2>
      <p>Ваш цвет: <strong id="yourColorDisplay"></strong></p>
      <div class="link-row">
        <input type="text" id="roomLinkInput" readonly>
        <button id="copyLinkBtn">📋 Копировать</button>
      </div>
      <p class="hint">Отправьте эту ссылку другу</p>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="connectingScreen" class="screen">
    <div class="card">
      <h2>Подключение к игре...</h2>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="gameScreen" class="screen">
    <div class="game-layout">
      <div class="side-panel">
        <div class="player-info">
          <span>Вы:</span>
          <span id="yourColor" class="color-indicator"></span>
        </div>
        <div class="player-info">
          <span>Соперник:</span>
          <span id="opponentColor" class="color-indicator"></span>
        </div>
        <p id="gameStatus" class="status"></p>

        <div id="movesList" class="moves-list"></div>

        <button id="resignBtn" class="btn-secondary">🏳️ Сдаться</button>
        <button id="rematchBtn" class="btn-secondary">🔄 Реванш</button>

        <div class="chat-box">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Сообщение...">
            <button id="sendChatBtn">➤</button>
          </div>
        </div>
      </div>

      <div id="chessboard" class="chessboard"></div>
    </div>
  </div>

</div>

<div id="promotionModal" class="modal">
  <div class="modal-content">
    <h3>Выберите фигуру</h3>
    <div class="promotion-pieces">
      <span class="promotion-piece" data-piece="q">♕</span>
      <span class="promotion-piece" data-piece="r">♖</span>
      <span class="promotion-piece" data-piece="b">♗</span>
      <span class="promotion-piece" data-piece="n">♘</span>
    </div>
  </div>
</div>

<div id="gameOverModal" class="modal">
  <div class="modal-content">
    <h2 id="gameOverMessage"></h2>
    <button id="modalRematchBtn" class="btn-main">🔄 Реванш</button>
    <button id="modalHomeBtn" class="btn-secondary">🏠 На главную</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script src="game.js"></script>
</body>
</html>
